apiVersion: apps/v1
kind: Deployment
metadata:
  name: axion-ui
spec:
  selector:
    matchLabels:
      app: axion-ui
  template:
    metadata:
      labels:
        app: axion-ui
    spec:
      containers:
      - name: axion-ui
        image: luckacr2026.azurecr.io/axion-ui:latest
        ports:
        - containerPort: 80
