name: Build and Push Axion UI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Azure login using OIDC
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Login to Azure Container Registry
      - name: Login to ACR
        run: |
          az acr login --name ${{ vars.ACR_NAME }}

      # Build Docker image
      - name: Build Docker image
        run: |
          docker build \
            -t ${{ vars.ACR_LOGIN_SERVER }}/axion-ui:${{ github.sha }} \
            -t ${{ vars.ACR_LOGIN_SERVER }}/axion-ui:latest \
            .

      # Push Docker image
      - name: Push Docker image
        run: |
          docker push ${{ vars.ACR_LOGIN_SERVER }}/axion-ui:${{ github.sha }}
          docker push ${{ vars.ACR_LOGIN_SERVER }}/axion-ui:latest
